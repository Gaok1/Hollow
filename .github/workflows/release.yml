name: Release

on:
  push:
    branches: [main]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.extract.outputs.should_release }}
    steps:
      - name: Extract version from commit message
        id: extract
        run: |
          MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$MSG" | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Found version: $VERSION"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No version tag in commit message, skipping release."
          fi

  # Hollow is Windows-only: the audio engine is built directly on WASAPI and
  # the shipped artefact is an NSIS installer.
  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      # `steamworks-sys` vendors the SDK, so there is nothing for CI to fetch
      # and the released binary is a full Steam build.
      - name: Build daemon
        run: cargo build --release --bin hollow-core

      # steamworks-sys leaves the redistributable in its build-script output;
      # stage it where electron-builder's extraResources expects it.
      - name: Stage Steam runtime
        shell: pwsh
        run: |
          $dll = Get-ChildItem target/release/build/steamworks-sys-*/out/steam_api64.dll |
            Select-Object -First 1
          if (-not $dll) { throw "steam_api64.dll was not emitted by steamworks-sys" }
          Copy-Item -LiteralPath $dll.FullName target/release/steam_api64.dll

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build installer
        working-directory: desktop
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hollow-windows-x86_64
          path: desktop/dist/*.exe

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Hollow ${{ needs.check-version.outputs.version }}
          files: artifacts/**/*.exe
          generate_release_notes: true
